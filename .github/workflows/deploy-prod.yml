name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      WORKSPACE: bydelsfakta-prod
      SSM_ENV: padda-prod
      SAM_DIR: sam/api
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install tox
      - name: Test with tox
        run: tox -e py,flake8,black
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_PROD }}:role/bydelsfakta-api-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Sts GetCallerIdentity
        run: aws sts get-caller-identity
      - name: Resolve deploy parameters from SSM
        id: ssm
        run: |
          echo "bucket=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/gold-volume/bucket --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
          echo "prefix=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/gold-volume/prefix --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
          echo "kms_key_arn=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/gold-volume/kms-key-arn --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
          echo "boundary_arn=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/lambda-permissions-boundary-arn --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
          echo "cfn_role_arn=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/sam/cfn-role-arn --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
          echo "artifacts_bucket=$(aws ssm get-parameter --name /${SSM_ENV}/bydelsfakta/sam/artifacts-bucket --query Parameter.Value --output text)" >> $GITHUB_OUTPUT
      - name: SAM build
        run: sam build
        working-directory: ${{ env.SAM_DIR }}
      - name: SAM deploy
        run: |
          sam deploy \
            --config-env prod \
            --s3-bucket "${{ steps.ssm.outputs.artifacts_bucket }}" \
            --role-arn "${{ steps.ssm.outputs.cfn_role_arn }}" \
            --parameter-overrides \
              WorkspaceName="$WORKSPACE" \
              S3Bucket="${{ steps.ssm.outputs.bucket }}" \
              S3Prefix="${{ steps.ssm.outputs.prefix }}" \
              KmsKeyArn="${{ steps.ssm.outputs.kms_key_arn }}" \
              PermissionsBoundaryArn="${{ steps.ssm.outputs.boundary_arn }}" \
              GitRev="${GITHUB_REF_NAME}:${GITHUB_SHA::7}"
        working-directory: ${{ env.SAM_DIR }}
