[tool.black]
target-version = ['py311']
# Keep exclude in sync with flake8 config in tox.ini
exclude = '''
/(
      \.git
    | \.tox
    | __pycache__
    | \*\.pyc
    | \.cache
    | \.eggs
    | .*\.egg
    | .*\.egg-info
    | env
    | venv
    | \..*venv
    | \.aws-sam
)/
'''

[tool.pytest.ini_options]
pythonpath = ["sam/api/src"]
