frameworkVersion: ">=3.38.0 <4.0.0"

service: bydelsfakta-api

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 29
  environment:
    # The gold-output Unity Catalog volume's bucket, prefix, and KMS key are
    # managed by padda-iac (workspace-bydelsfakta{,-prod}/bydelsfakta_api_config.tf)
    # and exposed through SSM. The Lambda reads from this volume's underlying
    # S3 location.
    S3_BUCKET: ${ssm:/padda-${self:provider.stage}/bydelsfakta/gold-volume/bucket}
    S3_PREFIX: ${ssm:/padda-${self:provider.stage}/bydelsfakta/gold-volume/prefix}
    GIT_REV: ${git:branch}:${git:sha1}
  logRetentionInDays: 90
  tracing:
    apiGateway: true
    lambda: true
  stackTags:
    # Required by the deploy role's tag-gated API Gateway permissions in
    # padda-iac (modules/bydelsfakta_api_deploy). CloudFormation propagates
    # stack tags to created resources, satisfying the IAM condition.
    Service: bydelsfakta-api
  iam:
    role:
      # Required by the deploy role: any Lambda execution role created by this
      # stack must attach this boundary, capping runtime privileges.
      permissionsBoundary: ${ssm:/padda-${self:provider.stage}/bydelsfakta/lambda-permissions-boundary-arn}
      managedPolicies:
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - "arn:aws:s3:::${self:provider.environment.S3_BUCKET}/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:provider.environment.S3_BUCKET}"
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource:
            - ${ssm:/padda-${self:provider.stage}/bydelsfakta/gold-volume/kms-key-arn}
  tags:
    GIT_REV: ${git:branch}:${git:sha1}

plugins:
  - serverless-better-credentials # must be first
  - "@kakkuk/serverless-aws-apigateway-documentation"
  - serverless-plugin-git-variables
  - serverless-prune-plugin
  - serverless-python-requirements

package:
  patterns:
    - '!**/*'
    - bydelsfakta_api/*.py

functions:
  get_dataset: ${file(serverless/functions/get_dataset.yaml)}

resources:
  Description: >
    ${self:service} ${git:branch}:${git:sha1}

    ${git:message}

custom:
  documentation:
    title: ${self:service}
    version: 0.1.1
    summary: ${self:service} API
    description: Fetch bydelsfakta.
    models:
      - ${file(./serverless/models/Response.yaml)}
      - ${file(./serverless/models/awsError.yaml)}
  prune:
    automatic: true
    number: 3
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    usePoetry: false
  exportGitVariables: false
